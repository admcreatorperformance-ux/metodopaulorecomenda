<!-- Supabase > Authentication > Emails > Magic Link. Assunto sugerido: "Seu código de acesso: {{ .Token }}" -->
<h2>Seu acesso à Área de Membros</h2>
<p>Use o código abaixo para entrar no Método Paulo Recomenda:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>

<p>Se você não pediu este acesso, ignore este e-mail.</p>
