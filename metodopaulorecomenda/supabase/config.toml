# Configuração do Supabase CLI / integração com GitHub.
# Itens não listados usam o padrão do Supabase.
project_id = "metodopaulorecomenda"

[auth]
# Aluno entra só por compra/convite (vale para ambiente local e branches).
enable_signup = false

[db.seed]
# O seed só roda em ambiente local/branch de teste, nunca em produção.
enabled = true
sql_paths = ["./seed.sql"]
